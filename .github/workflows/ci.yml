name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
    
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Get dependencies
      run: |
        go get -v -t -d ./...
        go mod download
        go mod verify
    
    - name: Run gofmt check
      run: bash ./scripts/gofmt.sh
    
    - name: Run tests with coverage
      run: bash ./scripts/coverage.sh
    
    - name: Upload coverage to Coveralls
      if: matrix.go-version == '1.23'
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: ./coverage.out
        format: golang
        flag-name: go-${{ matrix.go-version }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v4
      with:
        version: v1.61
        args: --timeout=5m

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      security-events: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
    
    - name: Run Gosec Security Scanner
      uses: securego/gosec@v2.21.4
      with:
        args: '-no-fail -fmt sarif -out results.sarif ./...'
    
    - name: Upload SARIF file
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif

  hurl-api-test:
    name: API Spec Test (Hurl)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Install Hurl
      run: |
        curl -sSL -o hurl.tar.gz https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl-8.0.1-x86_64-unknown-linux-gnu.tar.gz
        echo "cac7c4670d69444db120edb21fe06c97ba8c80dcc52279957c8dd18f05fb0c06  hurl.tar.gz" | sha256sum -c -
        tar xzf hurl.tar.gz
        echo "$PWD/hurl-8.0.1-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"

    - name: Get dependencies
      run: go mod download

    - name: Run Hurl API spec tests
      run: bash ./scripts/run-spec-tests.sh hurl

  bruno-api-test:
    name: API Spec Test (Bruno)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Bruno CLI
      run: npm install -g @usebruno/cli

    - name: Get dependencies
      run: go mod download

    - name: Run Bruno API spec tests
      run: bash ./scripts/run-spec-tests.sh bruno
