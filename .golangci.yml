version: "2"
linters:
  default: none
  enable:
    - misspell
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - SA*
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
